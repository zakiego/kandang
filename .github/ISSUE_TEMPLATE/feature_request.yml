name: Feature request
description: Suggest a change or something new.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task your agent is doing and where Kandang gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Keep in mind runs have no network and Kandang never holds secrets.
