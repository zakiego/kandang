name: Bug report
description: Something in Kandang doesn't work the way the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security issue, like a sandbox escape or a way around the limits? Don't file it here. Use the private report described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Request to reproduce
      description: The POST /v1/runs body (trim large files) or the steps you took. Leave out your token.
      render: json
  - type: textarea
    id: health
    attributes:
      label: GET /health output
      description: Shows the Kandang and runsc versions.
      render: json
  - type: input
    id: host
    attributes:
      label: Host
      description: OS, architecture, and how you run it (OrbStack machine, VM, bare metal).
